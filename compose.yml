services:
  postgres:
    image: postgres:17-alpine
    container_name: content-generator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER?:"Error -- Postgres user is required"}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?:"Error -- Postgres user is required"}
      POSTGRES_DB: ${POSTGRES_DB?:"Error -- Postgres user is required"}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content_generator"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: content-generator-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    # command: redis-server --requirepass ${REDIS_PASS?:"Error -- Redis Password is required"}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ngrok:
    image: ngrok/ngrok:3.39.11-alpine
    restart: unless-stopped
    command:
      - "http"
      - "api:3000"
      - "--url=aware-wanted-puma.ngrok-free.app"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?"Error -- Ngrok authtoken is required"}
    depends_on:
      - api

  api:
    build:
      context: ./api
    restart: unless-stopped
    command: npx prisma migrate deploy
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    volumes:
      - api-storage:/usr/src/clip-forge-api/storage
    healthcheck:
      test:
        [
        "CMD-SHELL",
        "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1",
        ]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  redisdata:
  api-storage:
